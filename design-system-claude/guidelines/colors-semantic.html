<!-- @dsCard group="Colors" viewport="700x130" subtitle="Status colors draw from the aurora hues" name="Semantic" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;display:flex;gap:8px;padding:16px;background:var(--surface-page)}.st{flex:1;border-radius:12px;height:98px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 14px;font-family:var(--font-display);font-size:14px}.st b{font-weight:600}.st i{font-style:normal;font-size:11px;opacity:.75}</style></head><body>
<div class="st" style="background:var(--status-success-bg);color:var(--status-success)"><b>Success</b><i>teal-500 on teal-100</i></div>
<div class="st" style="background:var(--status-warning-bg);color:var(--status-warning)"><b>Warning</b><i>gold-600 on gold-100</i></div>
<div class="st" style="background:var(--status-error-bg);color:var(--status-error)"><b>Error</b><i>#C14E6E on rose-100</i></div>
<div class="st" style="background:var(--status-info-bg);color:var(--status-info)"><b>Info</b><i>sky-500 on sky-100</i></div>
</body></html>
