<!-- @dsCard group="Type" viewport="700x290" subtitle="Token scale from hero to caption" name="Type scale" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 24px;background:var(--surface-page)}.row{display:flex;align-items:baseline;gap:16px;padding:4px 0}.tok{font-family:var(--font-display);font-size:11px;letter-spacing:.06em;color:var(--text-muted);width:110px;flex:none}.sp{font-family:var(--font-display);color:var(--text-heading);white-space:nowrap}</style></head><body>
<div class="row"><span class="tok">--text-h1 40</span><span class="sp" style="font-size:40px">Heading one</span></div>
<div class="row"><span class="tok">--text-h2 28</span><span class="sp" style="font-size:28px">Heading two</span></div>
<div class="row"><span class="tok">--text-h3 20</span><span class="sp" style="font-size:20px">Heading three</span></div>
<div class="row"><span class="tok">--text-lg 19</span><span style="font-family:var(--font-body);font-size:19px">Lead paragraph text</span></div>
<div class="row"><span class="tok">--text-base 17</span><span style="font-family:var(--font-body);font-size:17px">Body text</span></div>
<div class="row"><span class="tok">--text-sm 15</span><span style="font-family:var(--font-body);font-size:15px">Small text</span></div>
<div class="row"><span class="tok">--text-caption 13</span><span style="font-family:var(--font-body);font-size:13px;color:var(--text-muted)">Caption text</span></div>
</body></html>
