<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px 20px;background:var(--surface-page)}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.RosevilleNewChurchDesignSystem_094ee1;
const {Button,IconButton,Input,Select,Checkbox,Radio,Switch} = NS;
const Ic = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>;
function Demo(){
  const [c,setC]=React.useState(true),[r,setR]=React.useState('inperson'),[s,setS]=React.useState(true);
  return <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <Button>Join us this Sunday</Button>
      <Button variant="gold">Plan a visit</Button>
      <Button variant="secondary">Read more</Button>
      <Button variant="ghost">Contact</Button>
      <Button disabled>Disabled</Button>
      <Button size="sm" icon={<Ic/>}>With icon</Button>
      <IconButton icon={<Ic/>} label="Light" variant="tinted"/>
      <IconButton icon={<Ic/>} label="Light" variant="primary"/>
    </div>
    <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
      <Input label="Email address" placeholder="you@example.com" hint="We will never share it." style={{flex:1}}/>
      <Input label="Name" defaultValue="" error="Please enter your name" style={{flex:1}}/>
      <Select label="Service" options={['Sunday worship','Bible study','Retreat']} style={{flex:1}}/>
    </div>
    <div style={{display:'flex',gap:24,alignItems:'center',flexWrap:'wrap'}}>
      <Checkbox label="Send me the newsletter" checked={c} onChange={setC}/>
      <Radio name="t" value="inperson" label="In person" checked={r==='inperson'} onChange={setR}/>
      <Radio name="t" value="zoom" label="On Zoom" checked={r==='zoom'} onChange={setR}/>
      <Switch label="Email reminders" checked={s} onChange={setS}/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
