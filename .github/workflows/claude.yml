name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      # write on contents + pull-requests is what lets Claude push a branch
      # and open a PR. With `read` it can only comment.
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Trigger by adding the `claude` label to an issue, as well as by
          # writing @claude in an issue or comment.
          label_trigger: claude

          # Model is chosen here. Without --model the action uses the Claude Code
          # CLI default; set it explicitly so runs are reproducible.
          # Project-wide instructions live in CLAUDE.md (read automatically).
          # --append-system-prompt is for CI-only behaviour on top of that.
          claude_args: |
            --model claude-opus-5
            --append-system-prompt "You are responding to an issue filed by a non-technical collaborator. Do not push to main: create a branch and open a pull request. If the request is ambiguous, make the most reasonable interpretation, ship it, and state your assumption in the PR description. Write the PR description in plain language a non-developer can review, and describe the visible change on the site rather than the code. Include a short 'How to check this' section."

